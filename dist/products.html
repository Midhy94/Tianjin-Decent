<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Catalog — TIANJIN DECENT INTERNATIONAL TRADE CO., LTD.</title>
  <meta name="description" content="Comprehensive catalog of Steel Coils, Structural Steel Profiles, Modular Scaffolding Systems, Tubes, Fittings, and Accessories supplied by TIANJIN DECENT INTERNATIONAL TRADE CO., LTD." />
  
  <link rel="icon" type="image/png" href="/src/assets/images/T-D-Logo.png" />
  
  <style>
    .catalog-header {
      padding: clamp(48px, 6vw, 80px) 0 clamp(24px, 4vw, 40px);
      background-color: var(--color-canvas);
      border-bottom: 1px solid var(--color-hairline);
    }
    
    .filter-bar {
      display: flex;
      align-items: center;
      gap: var(--space-xs);
      flex-wrap: wrap;
      margin-top: var(--space-xl);
    }
    
    .filter-chip {
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 500;
      border-radius: var(--radius-pill);
      background-color: var(--color-canvas-soft);
      border: 1px solid var(--color-hairline);
      color: var(--color-body);
      cursor: pointer;
      transition: all var(--transition-instant);
    }
    
    .filter-chip:hover {
      background-color: var(--color-canvas);
      border-color: var(--color-primary);
      color: var(--color-primary);
    }
    
    .filter-chip.is-active {
      background-color: var(--color-primary);
      border-color: var(--color-primary);
      color: #FFFFFF;
    }
    
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
      margin-top: var(--space-2xl);
    }
    
    .product-card {
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: var(--radius-card-premium, 28px);
      box-shadow: none; /* No drop shadows */
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      min-height: 500px;
      text-decoration: none;
      color: #FFFFFF;
      background-color: #0b1524;
      transition: border-color 0.25s ease;
    }
    
    .product-card:hover {
      /* Subtle outline highlight, NO pop animation */
      border-color: rgba(255, 255, 255, 0.38);
    }
    
    .product-card__img-wrap {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      background-color: #0b1524;
      overflow: hidden;
    }
    
    .product-card__img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      display: block;
    }
    
    .product-card:hover .product-card__img {
      transform: scale(1.03); /* Subtle micro scale, no pop */
    }

    .product-card__bookmark {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 4;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.32);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      box-shadow: none;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
      padding: 0;
    }

    .product-card__bookmark:hover {
      background: rgba(255, 255, 255, 0.38);
      border-color: rgba(255, 255, 255, 0.55);
    }

    .product-card__bookmark.is-saved {
      background: #FFFFFF;
      color: #0b1524;
    }

    .product-card__bookmark svg {
      width: 17px;
      height: 17px;
      fill: currentColor;
    }
    
    /* 
      Frosted Glass Text Overlay sitting over the bottom of the photo.
      The blur captures and reflects the photo's colors naturally!
    */
    .product-card__body {
      position: relative;
      z-index: 2;
      margin-top: auto;
      padding: 22px 22px 22px 22px;
      display: flex;
      flex-direction: column;
      background: linear-gradient(
        180deg,
        rgba(10, 20, 32, 0.38) 0%,
        rgba(10, 20, 32, 0.74) 42%,
        rgba(10, 20, 32, 0.94) 100%
      );
      backdrop-filter: blur(28px) saturate(140%);
      -webkit-backdrop-filter: blur(28px) saturate(140%);
      border-top: 1px solid rgba(255, 255, 255, 0.15);
    }

    .product-card__header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .product-card__title-group {
      display: flex;
      flex-direction: column;
    }
    
    .product-card__category {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #38bdf8;
      margin-bottom: 3px;
    }
    
    .product-card__name {
      font-family: var(--font-heading);
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.015em;
      color: #FFFFFF;
      line-height: 1.25;
      margin: 0;
    }

    .product-card__badge {
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 9999px;
      padding: 4px 12px;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      color: #FFFFFF;
      white-space: nowrap;
      flex-shrink: 0;
    }
    
    .product-card__desc {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.78);
      line-height: 1.5;
      margin: 0 0 16px 0;
      flex-grow: 1;
    }
    
    .product-card__specs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 20px;
      margin-top: auto;
    }

    .product-card__spec-pill {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 9999px;
      padding: 4px 11px;
      font-size: 11px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.92);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }
    
    .product-card__cta {
      display: block;
      width: 100%;
      text-align: center;
      background: #FFFFFF;
      color: #0b1524;
      font-family: var(--font-primary);
      font-size: 14px;
      font-weight: 700;
      padding: 13px 20px;
      border-radius: 9999px;
      box-shadow: none;
      border: none;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .product-card:hover .product-card__cta {
      background: #F1F5F9;
      color: #020617;
    }
    
    @media (max-width: 1024px) {
      .catalog-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 24px;
      }
    }
    
    @media (max-width: 640px) {
      .catalog-grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }
    }
  </style>
  <script type="module" crossorigin src="/assets/products-CR86U7ra.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/footer-H4YDPbGW.js">
  <link rel="stylesheet" crossorigin href="/assets/footer-CP8i2rW2.css">
</head>
<body>

  <div id="nav-placeholder"></div>

  <main id="main-content">
    
    <!-- Header -->
    <section class="catalog-header">
      <div class="container">
        <h1 class="heading-display-lg" style="margin-bottom: var(--space-xs);">
          Industrial Products & Specifications.
        </h1>
        <p class="text-lead" style="color: var(--color-muted); max-width: 760px;">
          Explore flat steel coils, structural sections, modular scaffolding systems, and access hardware conforming to international EN, ASTM, BS, and JIS standards.
        </p>

        <!-- Category Filters -->
        <div class="filter-bar" id="category-filters">
          <button class="filter-chip is-active" data-category="all">All Products</button>
          <button class="filter-chip" data-category="steel-coils">Steel Coils</button>
          <button class="filter-chip" data-category="structural-profiles">Structural Steel & Pipes</button>
          <button class="filter-chip" data-category="scaffolding-systems">Scaffolding Systems</button>
          <button class="filter-chip" data-category="tubes-fittings">Tubes & Fittings</button>
          <button class="filter-chip" data-category="platforms">Platforms & Boards</button>
          <button class="filter-chip" data-category="mobile-towers">Mobile Towers</button>
          <button class="filter-chip" data-category="safety-accessories">Accessories & Safety</button>
        </div>
      </div>
    </section>

    <!-- Products Grid Section -->
    <section class="section surface-soft">
      <div class="container">
        
        <div id="products-count" style="font-family: var(--font-mono); font-size: 12px; color: var(--color-muted); margin-bottom: var(--space-md);">
          Showing all products
        </div>

        <div class="catalog-grid" id="catalog-grid">
          <!-- Populated by products.js script -->
        </div>

      </div>
    </section>

  </main>

  <div id="footer-placeholder"></div>


</body>
</html>
