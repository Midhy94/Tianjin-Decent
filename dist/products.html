<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Catalog — TIANJIN DECENT INTERNATIONAL TRADE CO., LTD.</title>
  <meta name="description" content="Comprehensive catalog of Steel Coils, Structural Steel Profiles, Modular Scaffolding Systems, Tubes, Fittings, and Accessories supplied by TIANJIN DECENT INTERNATIONAL TRADE CO., LTD." />
  
  <link rel="icon" type="image/png" href="/assets/T-D-Logo-CoMgngHF.png" />
  
  <style>
    .catalog-header {
      padding: clamp(48px, 6vw, 80px) 0 clamp(24px, 4vw, 40px);
      background-color: var(--color-canvas);
      border-bottom: 1px solid var(--color-hairline);
    }
    
    .filter-bar {
      display: flex;
      align-items: center;
      gap: var(--space-xs);
      flex-wrap: wrap;
      margin-top: var(--space-xl);
    }
    
    .filter-chip {
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 500;
      border-radius: var(--radius-pill);
      background-color: var(--color-canvas-soft);
      border: 1px solid var(--color-hairline);
      color: var(--color-body);
      cursor: pointer;
      transition: all var(--transition-instant);
    }
    
    .filter-chip:hover {
      background-color: var(--color-canvas);
      border-color: var(--color-primary);
      color: var(--color-primary);
    }
    
    .filter-chip.is-active {
      background-color: var(--color-primary);
      border-color: var(--color-primary);
      color: #FFFFFF;
    }
    
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-xl);
      margin-top: var(--space-2xl);
    }
    
    .product-card {
      background-color: var(--color-canvas);
      border: 1px solid var(--color-hairline);
      border-radius: var(--radius-sm);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      transition: transform var(--transition-instant), border-color var(--transition-instant);
    }
    
    .product-card:hover {
      transform: translateY(-4px);
      border-color: var(--color-primary);
    }
    
    .product-card__img-wrap {
      width: 100%;
      height: 220px;
      background-color: var(--color-canvas-soft);
      overflow: hidden;
    }
    
    .product-card__img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform var(--transition-smooth);
    }
    
    .product-card:hover .product-card__img {
      transform: scale(1.04);
    }
    
    .product-card__body {
      padding: var(--space-lg);
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    
    .product-card__category {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-primary);
      margin-bottom: 4px;
    }
    
    .product-card__name {
      font-size: 18px;
      font-weight: 600;
      color: var(--color-ink);
      line-height: 1.25;
      margin-bottom: 8px;
    }
    
    .product-card__desc {
      font-size: 13px;
      color: var(--color-muted);
      line-height: 1.5;
      margin-bottom: var(--space-md);
      flex-grow: 1;
    }
    
    .product-card__specs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: var(--space-md);
    }
    
    .product-card__footer {
      border-top: 1px solid var(--color-hairline);
      padding-top: var(--space-md);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--color-primary);
    }
    
    @media (max-width: 1024px) {
      .catalog-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    
    @media (max-width: 640px) {
      .catalog-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <script type="module" crossorigin src="/assets/products-CmP9ztU_.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/footer-COQYqE8C.js">
  <link rel="stylesheet" crossorigin href="/assets/footer-zmU3yRKE.css">
</head>
<body>

  <div id="nav-placeholder"></div>

  <main id="main-content">
    
    <!-- Header -->
    <section class="catalog-header">
      <div class="container">
        <div class="section-kicker">CATALOG // TIANJIN DECENT</div>
        <h1 class="heading-display-lg" style="margin-bottom: var(--space-xs);">
          Industrial Products & Specifications.
        </h1>
        <p class="text-lead" style="color: var(--color-muted); max-width: 760px;">
          Explore flat steel coils, structural sections, modular scaffolding systems, and access hardware conforming to international EN, ASTM, BS, and JIS standards.
        </p>

        <!-- Category Filters -->
        <div class="filter-bar" id="category-filters">
          <button class="filter-chip is-active" data-category="all">All Products</button>
          <button class="filter-chip" data-category="steel-coils">Steel Coils</button>
          <button class="filter-chip" data-category="structural-profiles">Structural Steel & Pipes</button>
          <button class="filter-chip" data-category="scaffolding-systems">Scaffolding Systems</button>
          <button class="filter-chip" data-category="tubes-fittings">Tubes & Fittings</button>
          <button class="filter-chip" data-category="platforms">Platforms & Boards</button>
          <button class="filter-chip" data-category="mobile-towers">Mobile Towers</button>
          <button class="filter-chip" data-category="safety-accessories">Accessories & Safety</button>
        </div>
      </div>
    </section>

    <!-- Products Grid Section -->
    <section class="section surface-soft">
      <div class="container">
        
        <div id="products-count" style="font-family: var(--font-mono); font-size: 12px; color: var(--color-muted); margin-bottom: var(--space-md);">
          Showing all products
        </div>

        <div class="catalog-grid" id="catalog-grid">
          <!-- Populated by products.js script -->
        </div>

      </div>
    </section>

  </main>

  <div id="footer-placeholder"></div>


</body>
</html>
