<svg width="140" height="40" viewBox="0 0 140 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Globe mark -->
  <g transform="translate(0, 4)">
    <!-- Outer circle -->
    <circle cx="16" cy="16" r="14.5" stroke="#0A1628" stroke-width="1.5" fill="none"/>
    <!-- Longitude lines (vertical ellipses) -->
    <ellipse cx="16" cy="16" rx="6" ry="14.5" stroke="#0A1628" stroke-width="1" fill="none" opacity="0.5"/>
    <!-- Latitude lines (horizontal) -->
    <line x1="1.5" y1="10" x2="30.5" y2="10" stroke="#0A1628" stroke-width="1" opacity="0.4"/>
    <line x1="1.5" y1="16" x2="30.5" y2="16" stroke="#0A1628" stroke-width="1" opacity="0.5"/>
    <line x1="1.5" y1="22" x2="30.5" y2="22" stroke="#0A1628" stroke-width="1" opacity="0.4"/>
    <!-- Precision crosshair -->
    <circle cx="16" cy="16" r="1.5" fill="#1A3A6B"/>
  </g>
  <!-- Wordmark -->
  <g transform="translate(40, 0)">
    <text x="0" y="18" font-family="Inter, Helvetica Neue, sans-serif" font-size="13" font-weight="500" letter-spacing="-0.02em" fill="#0A1628">TIANJIN DECENT</text>
    <text x="0" y="30" font-family="JetBrains Mono, monospace" font-size="7.5" font-weight="500" letter-spacing="0.14em" fill="#6B829E" text-transform="uppercase">INTERNATIONAL TRADING</text>
  </g>
</svg>
