<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Catalog — TIANJIN DECENT INTERNATIONAL TRADE CO., LTD.</title>
  <meta name="description" content="Comprehensive catalog of Steel plate& sheet, Steel Section&profile, Steel pipe &tube, steel wire&rod, and modular scaffolding systems by TIANJIN DECENT." />
  
  <link rel="icon" type="image/png" href="/src/assets/images/T-D-Logo.png" />
  <link rel="stylesheet" href="/src/css/tokens.css" />
  <link rel="stylesheet" href="/src/css/base.css" />
  <link rel="stylesheet" href="/src/css/components.css" />
  
  <style>
    .catalog-header {
      padding: clamp(76px, 6vw, 92px) 0 clamp(24px, 4vw, 40px);
      background-color: var(--color-canvas);
      border-bottom: 1px solid var(--color-hairline);
    }
    
    .filter-bar {
      display: flex;
      align-items: center;
      gap: var(--space-xs);
      flex-wrap: wrap;
      margin-top: var(--space-xl);
    }
    
    .filter-chip {
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 500;
      border-radius: var(--radius-pill);
      background-color: var(--color-canvas-soft);
      border: 1px solid var(--color-hairline);
      color: var(--color-body);
      cursor: pointer;
      transition: all var(--transition-instant);
    }
    
    .filter-chip:hover {
      background-color: var(--color-canvas);
      border-color: var(--color-primary);
      color: var(--color-primary);
    }
    
    .filter-chip.is-active {
      background-color: var(--color-primary);
      border-color: var(--color-primary);
      color: #FFFFFF;
    }

    .subcategory-filter-bar {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--color-hairline);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    
    .subcategory-filter-label {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--color-muted);
      margin-right: 4px;
    }

    .subfilter-chip {
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 500;
      border-radius: var(--radius-pill);
      background-color: var(--color-canvas-soft);
      border: 1px solid var(--color-hairline);
      color: var(--color-body);
      cursor: pointer;
      transition: all var(--transition-instant);
    }

    .subfilter-chip:hover {
      border-color: var(--color-primary);
      color: var(--color-primary);
    }

    .subfilter-chip.is-active {
      background-color: var(--color-primary);
      border-color: var(--color-primary);
      color: #FFFFFF;
    }
    
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
      margin-top: var(--space-2xl);
    }
    
    .product-card {
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: var(--radius-card-premium, 28px);
      box-shadow: none; /* No drop shadows */
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      min-height: 500px;
      text-decoration: none;
      color: #FFFFFF;
      background-color: #0b1524;
      transition: border-color 0.25s ease;
    }
    
    .product-card:hover {
      /* Subtle outline highlight, NO pop animation */
      border-color: rgba(255, 255, 255, 0.38);
    }
    
    .product-card__img-wrap {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      background-color: #0b1524;
      overflow: hidden;
    }
    
    .product-card__img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      display: block;
    }
    
    .product-card:hover .product-card__img {
      transform: scale(1.03); /* Subtle micro scale, no pop */
    }

    .product-card__bookmark {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 4;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.32);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      box-shadow: none;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
      padding: 0;
    }

    .product-card__bookmark:hover {
      background: rgba(255, 255, 255, 0.38);
      border-color: rgba(255, 255, 255, 0.55);
    }

    .product-card__bookmark.is-saved {
      background: #FFFFFF;
      color: #0b1524;
    }

    .product-card__bookmark svg {
      width: 17px;
      height: 17px;
      fill: currentColor;
    }
    
    /* 
      Frosted Glass Text Overlay sitting over the bottom of the photo.
      The blur captures and reflects the photo's colors naturally!
    */
    .product-card__body {
      position: relative;
      z-index: 2;
      margin-top: auto;
      padding: 22px 22px 22px 22px;
      display: flex;
      flex-direction: column;
      background: linear-gradient(
        180deg,
        rgba(10, 20, 32, 0.38) 0%,
        rgba(10, 20, 32, 0.74) 42%,
        rgba(10, 20, 32, 0.94) 100%
      );
      backdrop-filter: blur(28px) saturate(140%);
      -webkit-backdrop-filter: blur(28px) saturate(140%);
      border-top: 1px solid rgba(255, 255, 255, 0.15);
    }

    .product-card__header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .product-card__title-group {
      display: flex;
      flex-direction: column;
    }
    
    .product-card__category {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #38bdf8;
      margin-bottom: 3px;
    }
    
    .product-card__name {
      font-family: var(--font-heading);
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.015em;
      color: #FFFFFF;
      line-height: 1.25;
      margin: 0;
    }

    .product-card__badge {
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 9999px;
      padding: 4px 12px;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      color: #FFFFFF;
      white-space: nowrap;
      flex-shrink: 0;
    }
    
    .product-card__desc {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.78);
      line-height: 1.5;
      margin: 0 0 16px 0;
      flex-grow: 1;
    }
    
    .product-card__specs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 20px;
      margin-top: auto;
    }

    .product-card__spec-pill {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 9999px;
      padding: 4px 11px;
      font-size: 11px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.92);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }
    
    .product-card__cta {
      display: block;
      width: 100%;
      text-align: center;
      background: #FFFFFF;
      color: #0b1524;
      font-family: var(--font-primary);
      font-size: 14px;
      font-weight: 700;
      padding: 13px 20px;
      border-radius: 9999px;
      box-shadow: none;
      border: none;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .product-card:hover .product-card__cta {
      background: #F1F5F9;
      color: #020617;
    }
    
    @media (max-width: 1024px) {
      .catalog-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 24px;
      }
    }
    
    @media (max-width: 640px) {
      .catalog-grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }
    }
  </style>
</head>
<body>

  <div id="nav-placeholder"></div>

  <main id="main-content">
    
    <!-- Header -->
    <section class="catalog-header">
      <div class="container">
        <h1 class="heading-display-lg" style="margin-bottom: var(--space-xs);">
          Industrial Products & Specifications.
        </h1>
        <p class="text-lead" style="color: var(--color-muted); max-width: 760px;">
          Explore Steel plate&amp; sheet, Steel Section&amp;profile, Steel pipe &amp;tube, steel wire&amp;rod, and modular scaffolding system, and access hardware conforming to international EN, ASTM, BS, and JIS standards.
        </p>

        <!-- Category Filters -->
        <div class="filter-bar" id="category-filters">
          <button class="filter-chip is-active" data-category="all">All Products</button>
          <button class="filter-chip" data-category="steel-plate-sheet">Steel plate/sheet</button>
          <button class="filter-chip" data-category="steel-section-profile">Steel section/profile</button>
          <button class="filter-chip" data-category="steel-pipe-tube">Steel pipe/tube</button>
          <button class="filter-chip" data-category="scaffolding-accessories">Scaffolding &amp; Accessories</button>
          <button class="filter-chip" data-category="steel-wire-rod">Steel wire/rod</button>
        </div>

        <!-- Subcategory Filters -->
        <div class="subcategory-filter-bar" id="subcategory-filters" style="display: none;"></div>
      </div>
    </section>

    <!-- Products Grid Section -->
    <section class="section surface-soft">
      <div class="container">
        
        <div id="products-count" style="font-family: var(--font-mono); font-size: 12px; color: var(--color-muted); margin-bottom: var(--space-md);">
          Showing all products
        </div>

        <div class="catalog-grid" id="catalog-grid">
          <!-- Populated by products.js script -->
        </div>

      </div>
    </section>

  </main>

  <div id="footer-placeholder"></div>

  <script type="module">
    import { initNav } from '/src/js/components/nav.js';
    import { initFooter } from '/src/js/components/footer.js';
    import { PRODUCTS, CATEGORY_META, PRODUCT_HIERARCHY, normalizeCategory } from '/src/js/data/products.js';
    import { initScrollReveal, attachRevealTargets } from '/src/js/components/scroll-reveal.js';

    initNav();
    initFooter();
    initScrollReveal();

    const grid = document.getElementById('catalog-grid');
    const countEl = document.getElementById('products-count');
    const categoryFilterContainer = document.getElementById('category-filters');
    const subcategoryFilterContainer = document.getElementById('subcategory-filters');

    // Parse URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    let currentCategory = normalizeCategory(urlParams.get('category')) || 'all';
    let currentSubcategory = urlParams.get('subcategory') || 'all';

    function updateUrl() {
      const params = new URLSearchParams();
      if (currentCategory && currentCategory !== 'all') {
        params.set('category', currentCategory);
        if (currentSubcategory && currentSubcategory !== 'all') {
          params.set('subcategory', currentSubcategory);
        }
      }
      const newQuery = params.toString();
      const newUrl = newQuery ? `${window.location.pathname}?${newQuery}` : window.location.pathname;
      window.history.replaceState({}, '', newUrl);
    }

    function renderSubcategoryFilters() {
      if (!currentCategory || currentCategory === 'all' || !PRODUCT_HIERARCHY[currentCategory]) {
        subcategoryFilterContainer.style.display = 'none';
        subcategoryFilterContainer.innerHTML = '';
        return;
      }

      const hier = PRODUCT_HIERARCHY[currentCategory];
      subcategoryFilterContainer.style.display = 'flex';

      let html = `<span class="subcategory-filter-label">${hier.name}:</span>`;
      html += `<button class="subfilter-chip ${currentSubcategory === 'all' ? 'is-active' : ''}" data-sub="all">All ${hier.name}</button>`;

      hier.subcategories.forEach(sub => {
        const isActive = currentSubcategory === sub ? 'is-active' : '';
        html += `<button class="subfilter-chip ${isActive}" data-sub="${sub}">${sub}</button>`;
      });

      subcategoryFilterContainer.innerHTML = html;

      // Attach click events
      subcategoryFilterContainer.querySelectorAll('.subfilter-chip').forEach(btn => {
        btn.addEventListener('click', () => {
          subcategoryFilterContainer.querySelectorAll('.subfilter-chip').forEach(b => b.classList.remove('is-active'));
          btn.classList.add('is-active');
          currentSubcategory = btn.dataset.sub;
          updateUrl();
          renderProducts();
        });
      });
    }

    function renderProducts() {
      let filtered = PRODUCTS;

      // Filter by Category
      if (currentCategory && currentCategory !== 'all') {
        filtered = filtered.filter(p => p.category === currentCategory);
      }

      // Filter by Subcategory
      if (currentSubcategory && currentSubcategory !== 'all') {
        filtered = filtered.filter(p => p.subcategory === currentSubcategory);
      }

      const categoryLabel = currentCategory !== 'all' && PRODUCT_HIERARCHY[currentCategory] 
        ? PRODUCT_HIERARCHY[currentCategory].name 
        : 'All Products';
      const subLabel = currentSubcategory !== 'all' ? ` — ${currentSubcategory}` : '';

      countEl.textContent = `Displaying ${filtered.length} technical product lines (${categoryLabel}${subLabel})`;

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--color-muted);">
            <p style="font-size: 16px; margin-bottom: 12px;">No products found in this category / subcategory.</p>
            <button class="btn btn--primary" id="reset-filter-btn">Reset Filters</button>
          </div>
        `;
        document.getElementById('reset-filter-btn')?.addEventListener('click', () => {
          currentCategory = 'all';
          currentSubcategory = 'all';
          syncCategoryChips();
          renderSubcategoryFilters();
          updateUrl();
          renderProducts();
        });
        return;
      }

      grid.innerHTML = filtered.map(product => {
        const catName = product.categoryName || (CATEGORY_META[product.category]?.label || 'Industrial');
        const subName = product.subcategory || '';
        const primaryStandard = product.standards && product.standards[0] ? product.standards[0].name.split('/')[0].trim() : 'ISO 9001';
        
        // Find specification label or use fallback
        const specEntry = product.specifications && product.specifications.find(s => 
          s.label.toLowerCase().includes('specification') || s.label.toLowerCase().includes('thickness')
        );
        const specText = specEntry ? specEntry.value.split('|')[0].split('\n')[0].trim().substring(0, 26) : 'Certified Spec';
        const spec2 = product.specifications && product.specifications[2] ? product.specifications[2].value.substring(0, 22) : 'Export Standard';
        
        return `
          <a href="/product.html?id=${product.slug}" class="product-card">
            <div class="product-card__img-wrap">
              <img src="${product.heroImage}" alt="${product.name}" class="product-card__img" loading="lazy" />
              <button class="product-card__bookmark" type="button" aria-label="Save to Inquiry" onclick="event.preventDefault(); this.classList.toggle('is-saved');">
                <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
              </button>
            </div>
            <div class="product-card__body">
              <div class="product-card__header">
                <div class="product-card__title-group">
                  <span class="product-card__category">${catName}${subName ? ' • ' + subName : ''}</span>
                  <h2 class="product-card__name">${product.name}</h2>
                </div>
                <span class="product-card__badge">${primaryStandard}</span>
              </div>
              <p class="product-card__desc">${product.shortDescription}</p>
              
              <div class="product-card__specs">
                <span class="product-card__spec-pill">⭐ Certified Test Report</span>
                <span class="product-card__spec-pill">${specText}</span>
                <span class="product-card__spec-pill">${spec2}</span>
              </div>

              <span class="product-card__cta">View Specifications</span>
            </div>
          </a>
        `;
      }).join('');

      // Trigger subtle reveal on newly rendered cards
      attachRevealTargets(grid);
    }

    function syncCategoryChips() {
      const chips = categoryFilterContainer.querySelectorAll('.filter-chip');
      chips.forEach(btn => {
        const cat = normalizeCategory(btn.dataset.category);
        if (cat === currentCategory) {
          btn.classList.add('is-active');
        } else {
          btn.classList.remove('is-active');
        }
      });
    }

    // Attach click listeners to main category filter chips
    categoryFilterContainer.querySelectorAll('.filter-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        const targetCategory = normalizeCategory(btn.dataset.category);
        if (currentCategory === targetCategory) return;

        currentCategory = targetCategory;
        currentSubcategory = 'all'; // Reset subcategory when switching category

        syncCategoryChips();
        renderSubcategoryFilters();
        updateUrl();
        renderProducts();
      });
    });

    // Support browser back/forward navigation
    window.addEventListener('popstate', () => {
      const params = new URLSearchParams(window.location.search);
      currentCategory = normalizeCategory(params.get('category')) || 'all';
      currentSubcategory = params.get('subcategory') || 'all';
      syncCategoryChips();
      renderSubcategoryFilters();
      renderProducts();
    });

    // Initial render
    syncCategoryChips();
    renderSubcategoryFilters();
    renderProducts();
  </script>

</body>
</html>
