<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Catalog — TIANJIN DECENT INTERNATIONAL TRADE CO., LTD.</title>
  <meta name="description" content="Comprehensive catalog of Steel plate& sheet, Steel Section&profile, Steel pipe &tube, steel wire&rod, and modular scaffolding systems by TIANJIN DECENT." />
  
  <link rel="icon" type="image/png" href="/src/assets/images/T-D-Logo.png" />
  <link rel="stylesheet" href="/src/css/tokens.css" />
  <link rel="stylesheet" href="/src/css/base.css" />
  <link rel="stylesheet" href="/src/css/components.css" />
  
  <style>
    .catalog-header {
      padding: clamp(76px, 6vw, 92px) 0 clamp(24px, 4vw, 40px);
      background-color: var(--color-canvas);
      border-bottom: 1px solid var(--color-hairline);
    }
    
    .filter-bar {
      display: flex;
      align-items: center;
      gap: var(--space-xs);
      flex-wrap: wrap;
      margin-top: var(--space-xl);
    }
    
    .filter-chip {
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 500;
      border-radius: var(--radius-pill);
      background-color: var(--color-canvas-soft);
      border: 1px solid var(--color-hairline);
      color: var(--color-body);
      cursor: pointer;
      transition: all var(--transition-instant);
    }
    
    .filter-chip:hover {
      background-color: var(--color-canvas);
      border-color: var(--color-primary);
      color: var(--color-primary);
    }
    
    .filter-chip.is-active {
      background-color: var(--color-primary);
      border-color: var(--color-primary);
      color: #FFFFFF;
    }

    .subcategory-filter-bar {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--color-hairline);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    
    .subcategory-filter-label {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--color-muted);
      margin-right: 4px;
    }

    .subfilter-chip {
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 500;
      border-radius: var(--radius-pill);
      background-color: var(--color-canvas-soft);
      border: 1px solid var(--color-hairline);
      color: var(--color-body);
      cursor: pointer;
      transition: all var(--transition-instant);
    }

    .subfilter-chip:hover {
      border-color: var(--color-primary);
      color: var(--color-primary);
    }

    .subfilter-chip.is-active {
      background-color: var(--color-primary);
      border-color: var(--color-primary);
      color: #FFFFFF;
    }
    
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
      margin-top: var(--space-xl);
    }
    
    .product-card {
      background-color: var(--color-canvas, #FFFFFF);
      border: 1px solid var(--color-hairline, #E2E8F0);
      border-radius: var(--radius-card-premium, 20px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100%;
      color: inherit;
      transition: border-color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    
    .product-card:hover {
      border-color: rgba(0, 91, 227, 0.45);
      transform: translateY(-4px);
      box-shadow: 0 18px 36px -8px rgba(10, 37, 64, 0.1);
    }
    
    .product-card__img-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      background-color: #0b1524;
      overflow: hidden;
      display: block;
      text-decoration: none;
    }
    
    .product-card__img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      display: block;
    }
    
    .product-card:hover .product-card__img {
      transform: scale(1.04);
    }

    .product-card__category-pill {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 2;
      background: rgba(11, 21, 36, 0.82);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 9999px;
      padding: 4px 10px;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      color: #FFFFFF;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      pointer-events: none;
    }

    .product-card__body {
      padding: 20px 22px 22px;
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 12px;
      background: var(--color-canvas, #FFFFFF);
    }

    .product-card__meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .product-card__subcat {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--color-primary, #005be3);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .product-card__badge {
      background: #F1F5F9;
      border: 1px solid #E2E8F0;
      border-radius: 6px;
      padding: 3px 8px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      color: #334155;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .product-card__title {
      font-size: 18px;
      font-weight: 700;
      color: var(--color-ink, #0f172a);
      line-height: 1.35;
      margin: 0;
      min-height: 48px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .product-card__title-link {
      color: inherit;
      text-decoration: none;
      transition: color 0.18s ease;
    }

    .product-card__title-link:hover {
      color: var(--color-primary, #005be3);
    }

    .product-card__spec-box {
      background-color: var(--color-canvas-soft, #F8FAFC);
      border: 1px solid var(--color-hairline, #E2E8F0);
      border-radius: 12px;
      padding: 11px 13px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .product-card__spec-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 12px;
      line-height: 1.4;
    }

    .product-card__spec-lbl {
      font-family: var(--font-mono);
      font-weight: 700;
      color: var(--color-muted, #64748B);
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      flex-shrink: 0;
      min-width: 86px;
    }

    .product-card__spec-val {
      color: var(--color-ink, #1E293B);
      font-weight: 600;
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .product-card__uses {
      font-size: 12.5px;
      color: var(--color-body, #475569);
      line-height: 1.45;
      margin: 0;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 36px;
    }

    .product-card__footer {
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 14px;
      border-top: 1px solid var(--color-hairline, #E2E8F0);
    }

    .product-card__cta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      color: var(--color-primary, #005be3);
      text-decoration: none;
      transition: color 0.18s ease;
    }

    .product-card__cta-arrow {
      transition: transform 0.2s ease;
      display: inline-block;
    }

    .product-card:hover .product-card__cta-arrow {
      transform: translateX(4px);
    }

    .product-card__quote-btn {
      border-radius: var(--radius-pill);
      font-size: 12.5px;
      padding: 6px 16px;
      font-weight: 700;
      text-decoration: none;
    }
    
    @media (max-width: 1024px) {
      .catalog-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 22px;
      }
    }
    
    @media (max-width: 640px) {
      .catalog-grid {
        grid-template-columns: 1fr;
        gap: 18px;
      }
      .product-card__body {
        padding: 16px 18px 18px;
      }
    }
  </style>
</head>
<body>

  <div id="nav-placeholder"></div>

  <main id="main-content">
    
    <!-- Header -->
    <section class="catalog-header">
      <div class="container">
        <h1 class="heading-display-lg" style="margin-bottom: var(--space-xs);">
          Industrial Products & Specifications.
        </h1>
        <p class="text-lead" style="color: var(--color-muted); max-width: 760px;">
          Explore Steel plate&amp; sheet, Steel Section&amp;profile, Steel pipe &amp;tube, steel wire&amp;rod, and modular scaffolding system, and access hardware conforming to international EN, ASTM, BS, and JIS standards.
        </p>

        <!-- Category Filters -->
        <div class="filter-bar" id="category-filters">
          <button class="filter-chip is-active" data-category="all">All Products</button>
          <button class="filter-chip" data-category="steel-plate-sheet">Steel plate/sheet</button>
          <button class="filter-chip" data-category="steel-section-profile">Steel section/profile</button>
          <button class="filter-chip" data-category="steel-pipe-tube">Steel pipe/tube</button>
          <button class="filter-chip" data-category="scaffolding-accessories">Scaffolding &amp; Accessories</button>
          <button class="filter-chip" data-category="steel-wire-rod">Steel wire/rod</button>
        </div>

        <!-- Subcategory Filters -->
        <div class="subcategory-filter-bar" id="subcategory-filters" style="display: none;"></div>
      </div>
    </section>

    <!-- Products Grid Section -->
    <section class="section surface-soft">
      <div class="container">
        
        <div id="products-count" style="font-family: var(--font-mono); font-size: 12px; color: var(--color-muted); margin-bottom: var(--space-md);">
          Showing all products
        </div>

        <div class="catalog-grid" id="catalog-grid">
          <!-- Populated by products.js script -->
        </div>

      </div>
    </section>

  </main>

  <div id="footer-placeholder"></div>

  <script type="module">
    import { initNav } from '/src/js/components/nav.js';
    import { initFooter } from '/src/js/components/footer.js';
    import { PRODUCTS, CATEGORY_META, PRODUCT_HIERARCHY, normalizeCategory } from '/src/js/data/products.js';
    import { initScrollReveal, attachRevealTargets } from '/src/js/components/scroll-reveal.js';

    initNav();
    initFooter();
    initScrollReveal();

    const grid = document.getElementById('catalog-grid');
    const countEl = document.getElementById('products-count');
    const categoryFilterContainer = document.getElementById('category-filters');
    const subcategoryFilterContainer = document.getElementById('subcategory-filters');

    // Parse URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    let currentCategory = normalizeCategory(urlParams.get('category')) || 'all';
    let currentSubcategory = urlParams.get('subcategory') || 'all';

    function updateUrl() {
      const params = new URLSearchParams();
      if (currentCategory && currentCategory !== 'all') {
        params.set('category', currentCategory);
        if (currentSubcategory && currentSubcategory !== 'all') {
          params.set('subcategory', currentSubcategory);
        }
      }
      const newQuery = params.toString();
      const newUrl = newQuery ? `${window.location.pathname}?${newQuery}` : window.location.pathname;
      window.history.replaceState({}, '', newUrl);
    }

    function renderSubcategoryFilters() {
      if (!currentCategory || currentCategory === 'all' || !PRODUCT_HIERARCHY[currentCategory]) {
        subcategoryFilterContainer.style.display = 'none';
        subcategoryFilterContainer.innerHTML = '';
        return;
      }

      const hier = PRODUCT_HIERARCHY[currentCategory];
      subcategoryFilterContainer.style.display = 'flex';

      let html = `<span class="subcategory-filter-label">${hier.name}:</span>`;
      html += `<button class="subfilter-chip ${currentSubcategory === 'all' ? 'is-active' : ''}" data-sub="all">All ${hier.name}</button>`;

      hier.subcategories.forEach(sub => {
        const isActive = currentSubcategory === sub ? 'is-active' : '';
        html += `<button class="subfilter-chip ${isActive}" data-sub="${sub}">${sub}</button>`;
      });

      subcategoryFilterContainer.innerHTML = html;

      // Attach click events
      subcategoryFilterContainer.querySelectorAll('.subfilter-chip').forEach(btn => {
        btn.addEventListener('click', () => {
          subcategoryFilterContainer.querySelectorAll('.subfilter-chip').forEach(b => b.classList.remove('is-active'));
          btn.classList.add('is-active');
          currentSubcategory = btn.dataset.sub;
          updateUrl();
          renderProducts();
        });
      });
    }

    function renderProducts() {
      let filtered = PRODUCTS;

      // Filter by Category
      if (currentCategory && currentCategory !== 'all') {
        filtered = filtered.filter(p => p.category === currentCategory);
      }

      // Filter by Subcategory
      if (currentSubcategory && currentSubcategory !== 'all') {
        filtered = filtered.filter(p => p.subcategory === currentSubcategory);
      }

      const categoryLabel = currentCategory !== 'all' && PRODUCT_HIERARCHY[currentCategory] 
        ? PRODUCT_HIERARCHY[currentCategory].name 
        : 'All Products';
      const subLabel = currentSubcategory !== 'all' ? ` — ${currentSubcategory}` : '';

      countEl.textContent = `Displaying ${filtered.length} technical product lines (${categoryLabel}${subLabel})`;

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--color-muted);">
            <p style="font-size: 16px; margin-bottom: 12px;">No products found in this category / subcategory.</p>
            <button class="btn btn--primary" id="reset-filter-btn">Reset Filters</button>
          </div>
        `;
        document.getElementById('reset-filter-btn')?.addEventListener('click', () => {
          currentCategory = 'all';
          currentSubcategory = 'all';
          syncCategoryChips();
          renderSubcategoryFilters();
          updateUrl();
          renderProducts();
        });
        return;
      }

      grid.innerHTML = filtered.map(product => {
        const catName = product.categoryName || (CATEGORY_META[product.category]?.label || 'Industrial');
        const subName = product.subcategory || '';
        
        // Primary standard for badge
        let primaryStandard = 'ISO 9001';
        if (product.standards && product.standards.length > 0) {
          primaryStandard = product.standards[0].name.split('/')[0].trim();
        } else if (product.specifications) {
          const stdSpec = product.specifications.find(s => /standard/i.test(s.label));
          if (stdSpec) {
            primaryStandard = stdSpec.value.split(/[,;\n]/)[0].trim().substring(0, 18);
          }
        }

        // Full standards string for spec box
        let standardsText = 'ISO 9001, CE, Full Mill Test Certificate';
        if (product.standards && product.standards.length > 0) {
          standardsText = product.standards.map(s => s.name.split('/')[0].trim()).join(', ');
        } else if (product.specifications) {
          const stdSpec = product.specifications.find(s => /standard/i.test(s.label));
          if (stdSpec) {
            standardsText = stdSpec.value.split('\n')[0].trim();
          }
        }

        // Specification string for spec box
        let specText = 'Standard Certified Dimensions';
        if (product.specification) {
          specText = product.specification;
        } else if (product.specifications && product.specifications.length > 0) {
          const specEntry = product.specifications.find(s => 
            /specification|dimension|size|diameter|scope|range/i.test(s.label)
          ) || product.specifications[0];
          specText = specEntry.value.split('\n')[0].trim();
        }

        // Uses / applications string
        let usesText = product.shortDescription || '';
        if (product.uses) {
          usesText = product.uses;
        } else if (product.specifications) {
          const useSpec = product.specifications.find(s => /use|application/i.test(s.label));
          if (useSpec) {
            usesText = useSpec.value.split('\n')[0].trim();
          }
        }
        if (!usesText && product.applications && product.applications.length > 0) {
          usesText = product.applications[0];
        }
        
        return `
          <div class="product-card">
            <a href="/product.html?id=${product.slug}" class="product-card__img-wrap" aria-label="View specifications for ${product.name}">
              <img src="${product.heroImage}" alt="${product.name}" class="product-card__img" loading="lazy" />
              <span class="product-card__category-pill">${catName}</span>
            </a>
            <div class="product-card__body">
              <div class="product-card__meta-row">
                <span class="product-card__subcat">${subName || catName}</span>
                <span class="product-card__badge">${primaryStandard}</span>
              </div>
              <h3 class="product-card__title">
                <a href="/product.html?id=${product.slug}" class="product-card__title-link">${product.name}</a>
              </h3>
              <div class="product-card__spec-box">
                <div class="product-card__spec-row">
                  <span class="product-card__spec-lbl">Specification:</span>
                  <span class="product-card__spec-val" title="${specText}">${specText}</span>
                </div>
                <div class="product-card__spec-row">
                  <span class="product-card__spec-lbl">Standards:</span>
                  <span class="product-card__spec-val" title="${standardsText}">${standardsText}</span>
                </div>
              </div>
              <p class="product-card__uses">
                <strong>Uses:</strong> ${usesText}
              </p>
              <div class="product-card__footer">
                <a href="/product.html?id=${product.slug}" class="product-card__cta">
                  Explore Specs &amp; MTC <span class="product-card__cta-arrow">→</span>
                </a>
                <a href="/contact.html?product=${product.slug}" class="btn btn--primary btn--sm product-card__quote-btn">
                  Quote
                </a>
              </div>
            </div>
          </div>
        `;
      }).join('');

      // Trigger subtle reveal on newly rendered cards
      attachRevealTargets(grid);
    }

    function syncCategoryChips() {
      const chips = categoryFilterContainer.querySelectorAll('.filter-chip');
      chips.forEach(btn => {
        const cat = normalizeCategory(btn.dataset.category);
        if (cat === currentCategory) {
          btn.classList.add('is-active');
        } else {
          btn.classList.remove('is-active');
        }
      });
    }

    // Attach click listeners to main category filter chips
    categoryFilterContainer.querySelectorAll('.filter-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        const targetCategory = normalizeCategory(btn.dataset.category);
        if (currentCategory === targetCategory) return;

        currentCategory = targetCategory;
        currentSubcategory = 'all'; // Reset subcategory when switching category

        syncCategoryChips();
        renderSubcategoryFilters();
        updateUrl();
        renderProducts();
      });
    });

    // Support browser back/forward navigation
    window.addEventListener('popstate', () => {
      const params = new URLSearchParams(window.location.search);
      currentCategory = normalizeCategory(params.get('category')) || 'all';
      currentSubcategory = params.get('subcategory') || 'all';
      syncCategoryChips();
      renderSubcategoryFilters();
      renderProducts();
    });

    // Initial render
    syncCategoryChips();
    renderSubcategoryFilters();
    renderProducts();
  </script>

</body>
</html>
